name: Verify descended PR200 bit supplier and source-assisted v4 assembly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Replay PR189, PR200 and descended supplier; rebuild exact assembly
        run: make verify-source-assisted-v4
      - name: Require unchanged source certificates
        run: git diff --exit-code
